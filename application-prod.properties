# ===== SERVER =====
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ===== DATABASE (PostgreSQL on Render) =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== HIKARI CONNECTION POOL (tuned for Render free/starter) =====
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=LeadBackPool

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== THYMELEAF (cache in prod) =====
spring.thymeleaf.cache=true

# ===== TWILIO =====
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.account.token=${TWILIO_AUTH_TOKEN}
twilio.webhook.base-url=${TWILIO_WEBHOOK_BASE_URL}
twilio.country.code=${TWILIO_COUNTRY_CODE:KE}

# ===== STRIPE =====
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.price-id=${STRIPE_PRICE_ID}
stripe.success-url=${STRIPE_SUCCESS_URL}
stripe.cancel-url=${STRIPE_CANCEL_URL}

# ===== SEED ADMIN =====
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# ===== LOGGING =====
logging.level.com.leadback=INFO
logging.level.org.hibernate.SQL=WARN
