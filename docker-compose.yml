version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadback
      POSTGRES_USER: leadback
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - leadback-db:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/leadback
      SPRING_DATASOURCE_USERNAME: leadback
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}

      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WEBHOOK_BASE_URL: ${TWILIO_WEBHOOK_BASE_URL}
      TWILIO_COUNTRY_CODE: ${TWILIO_COUNTRY_CODE:-KE}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@leadback.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}

volumes:
  leadback-db:
