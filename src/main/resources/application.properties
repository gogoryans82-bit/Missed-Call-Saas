spring.application.name=leadback
server.port=8080
server.forward-headers-strategy=framework

# --- Dev DB (H2 file) ---
spring.datasource.url=jdbc:h2:file:./data/leadback;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Twilio ---
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.webhook.base-url=${TWILIO_WEBHOOK_BASE_URL:http://localhost:8080}
twilio.country.code=${TWILIO_COUNTRY_CODE:KE}

# --- Stripe ---
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price.id=${STRIPE_PRICE_ID:}
stripe.success.url=${STRIPE_SUCCESS_URL:http://localhost:8080/billing/success}
stripe.cancel.url=${STRIPE_CANCEL_URL:http://localhost:8080/billing/cancel}

# --- Seed admin ---
app.admin.email=${ADMIN_EMAIL:admin@leadback.local}
app.admin.password=${ADMIN_PASSWORD:changeme123}

logging.level.com.leadback=INFO
