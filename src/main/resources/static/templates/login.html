<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Login — LeadBack</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<nav><strong>LeadBack</strong><a href="/">Home</a><a href="/signup">Sign up</a></nav>
<main>
  <h1>Log in</h1>
  <div class="flash ok" th:if="${msg}" th:text="${msg}"></div>
  <div class="flash err" th:if="${param.error}">Invalid email or password.</div>

  <form class="stack" th:action="@{/login}" method="post">
    <input type="email" name="username" placeholder="Email" required autofocus/>
    <input type="password" name="password" placeholder="Password" required/>
    <button type="submit">Log in</button>
  </form>
</main>
</body>
</html>
