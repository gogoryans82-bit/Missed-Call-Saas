<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Sign up — LeadBack</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<nav><strong>LeadBack</strong><a href="/">Home</a><a href="/login">Login</a></nav>
<main>
  <h1>Create your account</h1>
  <div class="flash err" th:if="${error}" th:text="${error}"></div>

  <form class="stack" th:action="@{/signup}" method="post">
    <input name="businessName" placeholder="Business name" required/>
    <input type="email" name="email" placeholder="Email" required/>
    <input type="password" name="password" placeholder="Password" required minlength="8"/>
    <input name="ownerPhone" placeholder="Your mobile (e.g. +254712345678)" required/>
    <button type="submit">Create account</button>
  </form>
</main>
</body>
</html>
